# ---------------------------------------------------------------------------------------------------------------------
# R2DBC client / pool / SSL defaults (`ditto.postgresql.*`).
#
# The shared, backend-agnostic Postgres CLIENT configuration read by DittoPostgresClient / ConnectionPoolFactory /
# PostgresClientExtension (internal/utils/postgres-client). Every Postgres-backed component (the event-sourcing
# persistence backend, the search backend, ...) includes this ONE block so the pool/SSL/credentials are single-sourced.
# Formerly folded into `ditto-postgres-persistence.conf`; factored out here as part of the postgres-client extraction so
# `ditto-postgres-persistence.conf` (and, later, the search profile) `include classpath("ditto-postgres-client")`.
# Defaults mirror the deployed Mongo baseline so the backend can be swapped without re-tuning -- EXCEPT the pool
# overload settings (connect-timeout, pool.max-acquire-time, pool.acquire-retry, pool.pending-acquire-max-size), which
# are kept below the caller's 5s deadline on purpose (see the pool block). pool.max-size must be confirmed by load
# testing.
# ---------------------------------------------------------------------------------------------------------------------

ditto {
  postgresql {
    # R2DBC URL. Runtime role is DML-only (SELECT/INSERT/UPDATE/DELETE), no CREATE.
    uri = "r2dbc:postgresql://localhost:5432/ditto"
    uri = ${?POSTGRES_URI}

    # Optional runtime credentials; may instead be embedded in the URI.
    username = ""
    username = ${?POSTGRES_USER}
    password = ""
    password = ${?POSTGRES_PASSWORD}

    # direct | session | transaction -- informational only; drives a soft-WARN cross-check vs
    # prepared-statement-cache-queries. Never blocks boot.
    pooler-mode = "direct"
    pooler-mode = ${?POSTGRES_POOLER_MODE}

    # TCP connect timeout for opening a physical connection (r2dbc SPI CONNECT_TIMEOUT). Bounds how long a pool borrow
    # may block on a dead/unreachable host before failing fast. Keep STRICTLY LESS THAN pool.max-acquire-time (4s): a
    # borrow that has to open a fresh connection spends up to connect-timeout on the handshake WITHIN the
    # max-acquire-time budget, so connect-timeout < max-acquire-time lets the acquire surface the real connect failure
    # rather than a generic acquire timeout. Lower both together (ConnectionPoolFactory WARNs at startup if they are
    # not). Also bounds the one-shot schema-bootstrap (DDL) connection.
    connect-timeout = 2s
    connect-timeout = ${?POSTGRES_CONNECT_TIMEOUT}

    # Server-side statement_timeout: aborts any single statement that runs longer (SQLSTATE 57014, query_canceled).
    # Sent as a connection STARTUP parameter via the r2dbc-postgresql "options" map (a GUC name->value map, e.g.
    # {"statement_timeout":"60000"} in millis; each entry becomes a startup parameter of its own) rather than a plain
    # per-session "SET", which under transaction pooling would only reach the one server connection that ran it.
    #
    # 0 sends NO startup parameter; it does not mean "no timeout". The server-side default then applies on every path:
    # 60s for ditto_app as provisioned by deployment/postgres/provisioning/01-roles-and-grants.sql (no timeout only if
    # role, database and server set none). To lift the cap:
    #   - direct connection, or PgBouncer with track_extra_parameters: set a large value here; it reaches the server
    #     and overrides the role default (this key cannot send an explicit 0);
    #   - PgBouncer with ignore_startup_parameters: nothing set here reaches the server, so change the role default
    #     (ALTER ROLE ditto_app SET statement_timeout = 0, or ... RESET statement_timeout), then RECONNECT PgBouncer.
    #     While this key is 0, changing the role default works on every path.
    #
    # PgBouncer, in session and transaction mode alike, refuses a startup parameter it neither tracks nor ignores
    # ("unsupported startup parameter: ..."; verified with PgBouncer 1.26.0, and how a parameter PostgreSQL does not
    # report to clients, like statement_timeout, is tracked may differ between PgBouncer versions). The driver also
    # always sends extra_float_digits. So configure PgBouncer with one of:
    #   - ignore_startup_parameters = extra_float_digits and track_extra_parameters = statement_timeout: PgBouncer
    #     applies each client's value to the server connection it hands out, also per transaction, so this key is
    #     enforced as on a direct connection;
    #   - ignore_startup_parameters = extra_float_digits,statement_timeout: PgBouncer DROPS the value, so this key is
    #     silently NOT enforced. What is enforced then is the runtime role's default, which the provisioning script
    #     sets:   ALTER ROLE ditto_app SET statement_timeout = '60s';
    #     It applies to every server session PgBouncer opens as ditto_app, so PgBouncer's [databases] entry must not
    #     force a user= (an auth_user= is fine: it only runs the auth query).
    # Where the startup parameter reaches the server (direct connection, or PgBouncer with track_extra_parameters), it
    # overrides the role default. Details, including the DDL role: deployment/postgres/README.md.
    statement-timeout = 60s
    statement-timeout = ${?POSTGRES_STATEMENT_TIMEOUT}

    schema {
      # Runtime schema self-heal. When true (default) and a runtime statement hits a missing table (SQLSTATE 42P01),
      # the backend recreates the schema (idempotent CREATE ... IF NOT EXISTS, via the DDL role) and retries the
      # statement once — the Postgres counterpart to MongoDB's implicit-collection-create-on-first-use, so a dropped /
      # recreated database self-heals instead of failing every persistence call (e.g. list-connections 500ing after the
      # DB volume was recreated under a running service). Each heal emits a WARN + a ditto_persistence_schema_self_heal
      # metric because it MASKS DATA LOSS (a wiped DB silently self-heals to empty) — the same trade-off MongoDB has.
      # Set false to fail loud instead: the original 42P01 error then surfaces unchanged. NOTE: healing needs CREATE
      # privilege — it uses the ddl-credentials role (or the runtime role when ddl-credentials are empty). Where the
      # runtime role has no CREATE and no ddl-credentials are configured, a heal fails with 42501 and the original error
      # surfaces (self-heal is then "disabled in effect").
      self-heal = true
      self-heal = ${?POSTGRES_SCHEMA_SELF_HEAL}
    }

    pool {
      initial-size = 0
      # PER-SERVICE total: the journal, snapshot-store and read-journal of a service share ONE pool
      # (PostgresClientExtension), so max-size IS the per-service-instance connection budget (not ×3). Multiply only by
      # the replica count when sizing Postgres max_connections / PgBouncer pools.
      # >= Mongo code default (100). Per-service Helm override: things/policies -> 200 (match deployed Mongo
      # maxPoolSize), connectivity -> 50, search n/a (stays Mongo). Confirm by load testing.
      max-size = 100
      max-size = ${?POSTGRES_POOL_MAX_SIZE}

      # --- Pool overload: the acquire budget must fit INSIDE the caller's deadline ---------------------------------
      # A journal write that cannot get a connection within the acquire budget fails its Future, which STOPS the
      # persistent actor (Pekko WriteMessageFailure; NOT backpressure; the entity restarts with backoff). That is not
      # what breaks first, though: the caller gives up earlier. Things and policies commands wait 5s for the
      # persistence actor -- the supervisor's local-ask.timeout: for things
      # `ditto.things.thing.supervisor.local-ask.timeout` (things.conf:256, env THINGS_SUPERVISOR_LOCAL_ASK_TIMEOUT);
      # policies declare no local-ask block and use the code default
      # `LocalAskTimeoutConfig.LocalAskTimeoutConfigValue.ASK_TIMEOUT` (base/service LocalAskTimeoutConfig.java:62) --
      # and then fail with EnforcementTimeoutException.
      # A borrow that is still queued after 5s and then SUCCEEDS commits a write the caller was already told had
      # failed (e.g. CreateThing leaves an orphan Policy behind). So a LONGER acquire budget never helps: it only
      # widens that window. Keep (1 + acquire-retry) x max-acquire-time < 5s, and treat sustained queueing as a
      # capacity problem (max-size, PgBouncer, upstream throttling), not as a reason to raise these values.
      # (The mismatch is not Postgres-specific: Mongo's 30s maxWaitTime has the same relation to the 5s deadline.)
      # These settings apply to every borrow from the shared pool -- journal writes, recovery reads, snapshots, the
      # read journal and (in the search service) search queries/updates.
      #
      # Effective acquire budget = (1 + acquire-retry) x max-acquire-time = 4s by default.
      max-acquire-time = 4s
      max-acquire-time = ${?POSTGRES_POOL_MAX_ACQUIRE_TIME}
      # r2dbc-pool re-subscribes a failed acquire this many times, each with a FRESH max-acquire-time; the library
      # default of 1 silently doubles the budget (30s used to mean 60s). It also retries acquire timeouts and
      # pending-limit rejections, where a retry cannot help. Keep 0.
      acquire-retry = 0
      acquire-retry = ${?POSTGRES_POOL_ACQUIRE_RETRY}
      # Maximum number of borrowers that may WAIT once all max-size connections are in use; borrowers beyond it fail
      # IMMEDIATELY with PoolAcquirePendingLimitException (a journal write reports it as PostgresPoolOverloadException,
      # "PostgreSQL pool overload"), instead of queueing behind a deadline nobody will wait for. Deliberately no value
      # here: unset = 2 x max-size, derived in code so it follows a max-size override. 0 = no queue at all.
      # -1 = unbounded (r2dbc-pool's own default) -- discouraged: an unbounded queue only holds borrowers whose callers
      # have given up, and hides the overload signal; ConnectionPoolFactory WARNs at startup.
      pending-acquire-max-size = ${?POSTGRES_POOL_PENDING_ACQUIRE_MAX_SIZE}
      # ------------------------------------------------------------------------------------------------------------

      # 0 = no limit
      max-idle-time = 0s
      max-life-time = 0s
      # no server-side portal/cursor; keeps transaction-pooling safe.
      fetch-size = 0
      # 0 = unnamed statements -> safe under PgBouncer txn pooling on ANY version. Set >0 only behind
      # PgBouncer >= 1.21 with max_prepared_statements > 0.
      prepared-statement-cache-queries = 0

      # DDL role: OWNS the schema/tables (CREATE). Bootstrap-only. Empty -> reuse the runtime role.
      ddl-credentials {
        username = ""
        username = ${?POSTGRES_DDL_USER}
        password = ""
        password = ${?POSTGRES_DDL_PASSWORD}
      }
    }

    ssl {
      # disable | allow | prefer | require | verify-ca | verify-full ; r2dbc Option "sslMode".
      # verify-full validates the server cert chain AND the hostname.
      mode = "verify-full"
      mode = ${?POSTGRES_SSL_MODE}
      # r2dbc "sslRootCert": PEM CA bundle the server cert must chain to.
      root-cert = ""
      root-cert = ${?POSTGRES_SSL_ROOT_CERT}
      # Ditto guard: refuse to boot if mode is verify-(ca|full) AND root-cert unset.
      allow-system-truststore = false
      # Optional mTLS (r2dbc "sslCert"/"sslKey"/"sslPassword"); PEM cert + PKCS#8 key.
      cert = ""
      cert = ${?POSTGRES_SSL_CERT}
      key = ""
      key = ${?POSTGRES_SSL_KEY}
      key-password = ""
      key-password = ${?POSTGRES_SSL_KEY_PASSWORD}
    }
  }
}
