# ---------------------------------------------------------------------------------------------------------------------
# Ditto PostgreSQL things-search PROFILE (opt-in).
#
# This file is the OPT-IN Postgres counterpart to the Mongo search backend the thingsearch service ships by default
# (search.conf selects MongoSearchPersistenceProvider). A deployment that wants the PostgreSQL search backend opts in
# with a SINGLE top-level include from the search service config (see the CLASSPATH note in the *-pg-dev profile for why
# it must be top-level, NOT nested in `ditto { }`):
#
#     include classpath("ditto-postgres-search")   # provider selection + shared Postgres client/pool/SSL defaults
#
# Because the include is explicit, NOT including it leaves the Mongo default completely undisturbed.
#
# This profile does TWO things and nothing else:
#   1. Swaps `ditto.extensions.search-persistence-provider` to the PostgreSQL provider FQCN.
#   2. Pulls in the shared `ditto.postgresql.*` client/pool/SSL defaults via `include classpath("ditto-postgres-client")`
#      (single-sourced with the event-sourcing persistence backend; one pool per search JVM via PostgresClientExtension).
#
# It deliberately does NOT include `ditto-postgres-persistence` (the event-sourcing profile): that profile's
# auto-start journal lists would make Pekko resolve missing dispatchers and crash a search-only service (its own header
# warns this). The search backend is not a Pekko-persistence journal plugin, so it needs none of that wiring.
# ---------------------------------------------------------------------------------------------------------------------

ditto {
  extensions {
    # Swap the thing-search persistence backend from Mongo (search.conf default) to PostgreSQL. Plain FQCN string, same
    # shape as the Mongo default — no other change to search.conf is required.
    search-persistence-provider = "org.eclipse.ditto.internal.utils.persistence.postgres.search.PostgresSearchPersistenceProvider"
  }

  postgresql {
    # Plancache generic-plan-flip guard (plan §3.5 / bench-results §8.2): the read statements bind the queried leaf
    # path as a $n `wpath` value, so after five executions PostgreSQL can latch onto a wpath-agnostic GENERIC plan that
    # mis-estimates selectivity and mis-orders the EXISTS chain. force_custom_plan makes every read re-plan against its
    # actual bound wpath. Bound as a startup GUC on this (search-service) JVM's shared pool by ConnectionPoolFactory
    # (PgBouncer-RESET-safe). Verified active on a pooled connection by ConnectionPoolFactoryPlanCacheModeIT.
    force-custom-plan = true
    force-custom-plan = ${?POSTGRES_SEARCH_FORCE_CUSTOM_PLAN}

    search {
      # In-service TTL replacement for delete_at-marked rows (plan §3.6): Mongo relies on a TTL index over deleteAt;
      # PostgreSQL has no equivalent, so a periodic reaper actor does the deletion instead. Exactly one reaper runs per
      # JVM (started once, the first time the write path's createUpdaterPersistence() is materialized); safe
      # cross-JVM/cluster single-execution is guaranteed by a Postgres advisory lock (pg_try_advisory_xact_lock), NOT a
      # cluster singleton — simpler and dependency-free (see PostgresDeleteAtReaper's class javadoc for the rationale).
      reaper {
        # How often the reaper attempts a tick (try the advisory lock, drain, release).
        interval = 30s
        interval = ${?POSTGRES_SEARCH_REAPER_INTERVAL}

        # Rows deleted per batch — the LIMIT of the mandated "DELETE ... WHERE thing_id IN (SELECT ... FOR UPDATE SKIP
        # LOCKED)" shape. Keeps one DELETE statement's lock footprint bounded so a reap batch never stalls behind (or
        # blocks) an in-flight ThingUpdater transaction; SKIP LOCKED means a locked row is simply skipped this batch.
        batch-size = 1000
        batch-size = ${?POSTGRES_SEARCH_REAPER_BATCH_SIZE}

        # Safety valve: at most this many batches run within ONE tick (the loop otherwise drains until a batch deletes
        # fewer rows than batch-size, proving nothing more matches). A backlog larger than
        # batch-size * max-batches-per-tick is finished across subsequent ticks, so one tick's transaction is never
        # held open indefinitely against an arbitrarily large backlog (e.g. right after a large namespace purge).
        max-batches-per-tick = 50
        max-batches-per-tick = ${?POSTGRES_SEARCH_REAPER_MAX_BATCHES_PER_TICK}
      }
    }
  }
}

# Shared, backend-agnostic Postgres CLIENT config (uri / pool / SSL / credentials) read by DittoPostgresClient /
# ConnectionPoolFactory / PostgresClientExtension. Same single-sourced block the persistence profile includes, so the
# pool/SSL/credentials are identical across every Postgres-backed component. Tuned via POSTGRES_* env vars at runtime.
include classpath("ditto-postgres-client")
